name: Multi-OS Testing - Inderpal Singh

on:
  push:
    branches:
      - master

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Testing on Ubuntu..."
    - run: uname -a
    - run: echo "Ubuntu test by Inderpal Singh" > test-ubuntu.txt
    - run: cat test-ubuntu.txt
    - run: echo "Ubuntu tests completed"

  test-windows:
    runs-on: windows-latest
    steps:
    - run: echo "Testing on Windows..."
    - run: systeminfo
    - run: echo "Windows test by Inderpal Singh" > test-windows.txt
    - run: type test-windows.txt
    - run: echo "Windows tests completed"
